<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kutchi Hub - No internet</title>
    <!--
      Shown by the Capacitor apps (server.errorPath) when the site cannot be loaded. A plain local page: no scripts from outside, no images.
      Android (default): Hinglish text, Kutchi Hub orange #E8590C, "KUTCHI HUB" wordmark.
      iPhone / iPad (the iOS app shares this file): the original English page, unchanged - the script at the bottom switches to it.
    -->
    <style>
      :root { color-scheme: light; --brand: #E8590C; --brand-press: #c94a06; --brand-soft: #ffe9d6; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #faf8f5; color: #1f2430;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      .brand { margin: 0 0 28px; font-size: 1.5rem; font-weight: 800; letter-spacing: .04em; color: #111; }
      .brand span { color: var(--brand); }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand);
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 24px; color: #5b6270; line-height: 1.5; }
      button {
        appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px;
        font-size: 1rem; font-weight: 600; color: #fff; background: var(--brand);
      }
      button:active { background: var(--brand-press); }
      .status { margin-top: 16px; font-size: .85rem; color: #8a90a0; min-height: 1.2em; }
      /* iOS app: exactly the page it had before (no wordmark, the old orange). */
      html.ios { --brand: #ff6a00; --brand-press: #e65a00; }
      html.ios .brand { display: none; }
    </style>
  </head>
  <body>
    <main role="alert">
      <div class="brand" aria-label="Kutchi Hub"><span>KUTCHI</span> HUB</div>
      <div class="icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" /><path d="M8.5 16.5a5 5 0 0 1 7 0" /><path d="M2 8.8a15 15 0 0 1 4.2-2.7" />
          <path d="M10.7 5.1A15 15 0 0 1 22 8.8" /><path d="M5 12.9a10 10 0 0 1 5.2-2.8" /><path d="M13.9 10.2A10 10 0 0 1 19 12.9" /><line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1 id="title">Internet connection nahi hai</h1>
      <p id="text">Apna Wi-Fi ya mobile data check karke dobara try karein.</p>
      <button type="button" id="retry">Dobara try karein</button>
      <div class="status" id="status" aria-live="polite"></div>
    </main>
    <script>
      var SITE = "https://www.kutchihub.com"; // the same address as server.url in capacitor.config.ts (change both together)
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var T = ios
        ? { title: "No internet connection", text: "Kutchi Hub needs the internet to show local businesses. Check your Wi-Fi or mobile data, then try again.", retry: "Try again", still: "Still offline.", wait: "Reconnecting..." }
        : { title: "Internet connection nahi hai", text: "Apna Wi-Fi ya mobile data check karke dobara try karein.", retry: "Dobara try karein", still: "Abhi bhi internet nahi hai.", wait: "Connect ho raha hai..." };
      if (ios) document.documentElement.classList.add("ios");
      document.getElementById("title").textContent = T.title;
      document.getElementById("text").textContent = T.text;
      document.getElementById("retry").textContent = T.retry;
      var statusEl = document.getElementById("status"); // not "status": that name is window.status
      // The button reloads kutchihub.com. (The app also lands here when the site answers with an error page while the phone IS online:
      // then it simply tries the site again.)
      function retry() {
        if (navigator.onLine === false) { statusEl.textContent = T.still; return; }
        statusEl.textContent = T.wait;
        window.location.replace(SITE);
      }
      document.getElementById("retry").addEventListener("click", retry);
      // Reconnect by itself as soon as the phone is back online.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
