<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kutchi Hub - No internet</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #faf8f5; color: #1f2430;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; background: #ffe9d6; color: #ff6a00;
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 24px; color: #5b6270; line-height: 1.5; }
      button {
        appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px;
        font-size: 1rem; font-weight: 600; color: #fff; background: #ff6a00;
      }
      button:active { background: #e65a00; }
      .status { margin-top: 16px; font-size: .85rem; color: #8a90a0; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main role="alert">
      <div class="icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" /><path d="M8.5 16.5a5 5 0 0 1 7 0" /><path d="M2 8.8a15 15 0 0 1 4.2-2.7" />
          <path d="M10.7 5.1A15 15 0 0 1 22 8.8" /><path d="M5 12.9a10 10 0 0 1 5.2-2.8" /><path d="M13.9 10.2A10 10 0 0 1 19 12.9" /><line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>No internet connection</h1>
      <p>Kutchi Hub needs the internet to show local businesses. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" id="retry">Try again</button>
      <div class="status" id="status" aria-live="polite"></div>
    </main>
    <script>
      var SITE = "https://www.kutchihub.com/";
      var status = document.getElementById("status");
      function retry() {
        if (navigator.onLine === false) { status.textContent = "Still offline."; return; }
        status.textContent = "Reconnecting...";
        window.location.replace(SITE);
      }
      document.getElementById("retry").addEventListener("click", retry);
      // Reconnect by itself as soon as the phone is back online.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
